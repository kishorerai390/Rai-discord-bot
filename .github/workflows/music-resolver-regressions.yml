name: MusicMaid full regression suite

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/youtube-resolver-player-ui
      - fix-cookie-fallback-after-challenge

permissions:
  contents: read

jobs:
  bot-tests:
    name: Discord bot — full pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install bot and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Run every automated bot test
        run: python -m pytest -q

  website-checks:
    name: Website — typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install website dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build production website
        run: npm run build
