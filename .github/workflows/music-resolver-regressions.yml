name: Music resolver regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/youtube-resolver-player-ui]

jobs:
  resolver-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio aiosqlite
      - name: Run focused resolver and player regressions
        run: |
          python -m pytest -q tests/test_youtube_access_challenge.py tests/test_musicmaid_master_player_ui.py tests/test_fallback_title_matching.py tests/test_role_service.py tests/test_autoplay_controller.py
