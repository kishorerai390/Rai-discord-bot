name: Resolver fallback regression tests

on:
  push:
    branches:
      - fix/resolver-format-fallback-production
  pull_request:
    paths:
      - "music_bot/services/resolver_service.py"
      - "tests/test_resolver_format_fallback_fast.py"
      - ".github/workflows/resolver-fallback-tests.yml"

jobs:
  resolver-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Run targeted fallback regression
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_resolver_format_fallback_fast.py
