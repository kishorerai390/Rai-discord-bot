name: MusicMaid Current Bot Regression Suite

on:
  push:
    branches: [test/musicmaid-full-regression]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicmaid-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-timeout
      - name: Compile Python files
        run: python -m compileall -q music_bot tests
      - name: Run current MusicMaid regression tests
        timeout-minutes: 4
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          # Bound the process as well as individual tests. Some legacy tests leave
          # resolver worker threads alive after pytest has printed its summary.
          set +e
          timeout --foreground --signal=TERM --kill-after=10s 180s \
            python -m pytest -q --tb=short --timeout=90 --timeout-method=signal \
              --ignore=tests/test_live_playback_resolution.py 2>&1 | tee pytest-regression.log
          pytest_status=${PIPESTATUS[0]}
          set -e
          if grep -Eq '[1-9][0-9]* failed' pytest-regression.log; then
            exit 1
          fi
          if [ "$pytest_status" -eq 124 ] && grep -Eq '^[=]+ [0-9]+ passed([, ]|$)' pytest-regression.log; then
            echo "All collected tests passed; pytest left a background worker alive after reporting its summary." >&2
            exit 0
          fi
          if [ "$pytest_status" -ne 0 ]; then
            echo "Regression process did not exit cleanly (status $pytest_status)." >&2
            exit "$pytest_status"
          fi
