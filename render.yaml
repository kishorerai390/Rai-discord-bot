services:
  - type: web
    name: musicmaid-bot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "import static_ffmpeg; static_ffmpeg.add_paths()"
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MUSIC_BOT_TOKEN
        sync: false
      - key: NEKO_SONGS_BOT_TOKEN
        sync: false
      - key: APPLICATION_ID
        value: 1556676516274905218
      - key: BOT_NAME
        value: MusicMaid
      - key: EMBED_COLOR
        value: 0x00E5FF
      - key: LOG_LEVEL
        value: INFO
      - key: MUSIC_DATABASE_PATH
        value: data/music.db
      - key: COMMAND_SYNC_MODE
        value: global
      - key: BOT_OWNER_ID
        value: "1457380609641938981"
      - key: YOUTUBE_COOKIES
        sync: false
      - key: DISCORD_CLIENT_ID
        value: 1556676516274905218
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PAYMENT_PROVIDER
        value: "razorpay"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

